[project]
name = "dragonfly-lab"
version = "0.1.0"
description = "CPU-only dragonfly macro inspector: body/wing detection, dust speck detection and manual masking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
]

[project.scripts]
dragonfly-lab = "dragonfly_lab.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dragonfly_lab"]
