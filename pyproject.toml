[project]
name = "dragonfly-lab"
version = "0.2.0"
description = "CPU-only ground-truth annotation assistant for dragonfly macro photos: body/wing/dust detection, manual correction and benchmark package builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
]

[project.scripts]
dragonfly-lab = "dragonfly_lab.app:main"
dragonfly-lab-benchmark = "dragonfly_lab.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dragonfly_lab"]
